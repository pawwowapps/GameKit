ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.board.gamekit.ApplicationKt.module ]
    }
}

gamekit {
    database {
        url = "jdbc:sqlite:games_cache.db"
        url = ${?DATABASE_URL}
    }
    bgg {
        baseUrl = "https://boardgamegeek.com/xmlapi2"
        baseUrl = ${?BGG_BASE_URL}
        contact = ""
        contact = ${?BGG_CONTACT}
    }
    cache {
        ttlMinutes = 1440
        ttlMinutes = ${?CACHE_TTL_MINUTES}
    }
    search {
        defaultLimit = 30
        defaultLimit = ${?SEARCH_DEFAULT_LIMIT}
        maxLimit = 100
        maxLimit = ${?SEARCH_MAX_LIMIT}
        maxResults = 300
        maxResults = ${?SEARCH_MAX_RESULTS}
        minQueryLength = 3
        minQueryLength = ${?SEARCH_MIN_QUERY_LENGTH}
    }
}
